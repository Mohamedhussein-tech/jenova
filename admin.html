<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jenova | الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
</head>
<body>
<div class="wrap">
  <span class="brand">Jenova admin</span>
  <form class="card" id="login">
    <h2>دخول</h2>
    <label for="em">الإيميل</label><input id="em" type="email" autocomplete="username">
    <label for="pw">الباسورد</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn alt" type="submit">دخول</button>
  </form>
  <div id="app" hidden>
    <button class="btn alt sm" id="refresh" type="button">تحديث</button>
    <button class="btn alt sm" id="out" type="button">خروج</button>
    <div id="list"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const C = window.JENOVA, $ = (i) => document.getElementById(i);
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const LBL = { pending: "قيد التأكيد", confirmed: "مؤكد", shipped: "اتشحن", rejected: "مرفوض" };

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function load() {
  const { data, error } = await sb.from("orders").select("*, order_items(*)").order("created_at", { ascending: false }).limit(100);
  if (error) { $("list").textContent = "مفيش صلاحية. تأكد إن الإيميل هو إيميل الأدمن في schema.sql"; return; }
  $("list").innerHTML = "";
  for (const o of data) {
    const c = mk("div", "card");
    c.append(mk("h2", "", `#${o.code}`));
    const pill = mk("span", "pill " + o.status, LBL[o.status]); c.append(pill);
    c.append(mk("p", "", `${o.customer_name} • ${o.phone}`), mk("p", "", o.address));
    o.order_items.forEach((i) => c.append(mk("div", "row", `${i.name} | مقاس ${i.size} × ${i.qty}`)));
    c.append(mk("p", "", `الإجمالي: ${o.total} جنيه`), mk("p", "muted", `حوّل من: ${o.pay_wallet} • ${new Date(o.created_at).toLocaleString("ar-EG")}`));
    if (o.receipt_path) {
      const { data: s } = await sb.storage.from("receipts").createSignedUrl(o.receipt_path, 3600);
      if (s) { const a = mk("a", "", "عرض الإيصال"); a.href = s.signedUrl; a.target = "_blank"; a.rel = "noopener"; c.append(a); }
    }
    const bar = mk("div", "row");
    [["confirmed", "تأكيد الدفع"], ["shipped", "تم الشحن"], ["rejected", "رفض"]].forEach(([st, t]) => {
      const b = mk("button", "btn sm" + (st === "rejected" ? "" : " alt"), t); b.type = "button";
      b.onclick = async () => { await sb.from("orders").update({ status: st }).eq("id", o.id); load(); };
      bar.append(b);
    });
    c.append(bar); $("list").append(c);
  }
  if (!data.length) $("list").append(mk("p", "muted", "مفيش طلبات لسه."));
}
async function show() {
  const { data } = await sb.auth.getSession();
  const on = !!data.session; $("login").hidden = on; $("app").hidden = !on;
  if (on) load();
}
$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  if (error) $("lerr").textContent = "الإيميل أو الباسورد غلط"; else show();
});
$("refresh").onclick = load;
$("out").onclick = async () => { await sb.auth.signOut(); show(); };
show();
</script>
</body>
</html>
