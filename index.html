<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jenova | Don't Call Me</title>
<meta name="description" content="جينز Jenova. Balloon و Straight و Wide. 800 جنيه.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
body{overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:1100px;margin:0 auto}
.logo{font-family:"Permanent Marker",cursive;color:#fff;font-size:30px;line-height:1}
.bag{position:relative;background:#fff;border:2px solid var(--ink);padding:8px 14px;font:700 15px "Cairo",sans-serif;cursor:pointer;border-radius:2px}
.bag b{position:absolute;top:-9px;left:-9px;background:var(--red);color:#fff;min-width:22px;height:22px;border-radius:99px;font-size:13px;display:grid;place-items:center}
.hero{max-width:1100px;margin:0 auto;padding:6px 16px 0}
.hero .say{font-family:"Permanent Marker",cursive;color:var(--red);background:#fff;display:inline-block;padding:2px 12px;font-size:clamp(34px,9vw,72px);transform:rotate(-2deg);margin:0}
.hero p{color:#cfd8e4;margin:14px 0 0;max-width:34ch}
.rack{position:relative;margin-top:26px;padding-top:34px}
.rail{position:absolute;top:30px;left:0;right:0;height:10px;background:linear-gradient(#e9edf1,#8b97a5 60%,#5b6673);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.items{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 40px;max-width:1100px;margin:0 auto;position:relative;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.hang{flex:0 0 min(78vw,300px);scroll-snap-align:center;background:none;border:0;cursor:pointer;color:#fff;text-align:center;font:inherit;transform-origin:50% 0;padding:0 8px}
.hang .hook{display:block;width:34px;height:40px;margin:0 auto -6px;border:5px solid #cfd6de;border-bottom:0;border-radius:50% 50% 0 0}
.hang svg,.hang .ph{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.hang:hover,.hang:focus-visible{animation:sway 1.6s ease-in-out 1}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(2.5deg)}60%{transform:rotate(-2deg)}85%{transform:rotate(.8deg)}}
.hang .nm{display:block;font-family:"Permanent Marker",cursive;font-size:22px;margin-top:10px}
.hang .pr{display:block;color:var(--stitch);font-weight:700}
.rack-note{color:#cfd8e4;text-align:center;font-size:14px;margin:0 0 30px}
dialog{border:0;padding:0;background:var(--paper);max-width:min(94vw,520px);width:100%;border-radius:4px;color:var(--ink)}
dialog::backdrop{background:rgba(10,18,32,.72)}
.dlg{padding:20px;border:2px dashed var(--stitch);margin:8px}
.dlg h2{margin-bottom:4px}
.x{float:left;background:none;border:2px solid var(--ink);width:36px;height:36px;font-size:20px;cursor:pointer}
.view{background:#dfe5ea;margin:12px 0;padding:10px;text-align:center}
.view svg,.view .ph{width:62%;height:auto;max-height:46vh}
.view .ph{display:block;margin:0 auto;aspect-ratio:1/1.1;background-size:200% 100%;background-repeat:no-repeat}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:46px;padding:9px 10px;border:2px solid var(--ink);background:#fff;font:700 15px "Cairo",sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.ph{background-color:#dfe5ea}
footer{text-align:center;color:#9fb0c4;padding:10px 16px 36px;font-size:13px}
.empty{padding:20px 0}
</style>
</head>
<body>
<header>
  <span class="logo">Jenova</span>
  <button class="bag" id="bagBtn" type="button" aria-label="فتح السلة">السلة <b id="bagN">0</b></button>
</header>

<section class="hero">
  <h1 class="say">DON'T CALL ME</h1>
  <p>ثلاث قصّات جينز. اضغط على أي بنطلون على الرف تشوفه من قدام ومن ورا.</p>
</section>

<section class="rack" aria-label="رف المنتجات">
  <div class="rail" aria-hidden="true"></div>
  <div class="items" id="items"></div>
  <p class="rack-note">اسحب يمين وشمال لو الرف أطول من الشاشة</p>
</section>
<footer>Jenova • الدفع عبر اتصالات كاش</footer>

<dialog id="pdlg" aria-labelledby="pname"><div class="dlg">
  <button class="x" id="pclose" type="button" aria-label="إغلاق">×</button>
  <h2 id="pname"></h2><div class="pr" id="pprice"></div>
  <div class="seg" id="views" role="group" aria-label="زاوية العرض">
    <button type="button" data-v="front" aria-pressed="true">من قدام</button>
    <button type="button" data-v="back" aria-pressed="false">من ورا</button>
  </div>
  <div class="view" id="view"></div>
  <b>المقاس</b>
  <div class="seg" id="sizes" role="group" aria-label="المقاس"></div>
  <div class="err" id="perr" role="alert"></div>
  <button class="btn" id="addBtn" type="button">أضف للسلة</button>
</div></dialog>

<dialog id="cdlg" aria-labelledby="ctitle"><div class="dlg">
  <button class="x" id="cclose" type="button" aria-label="إغلاق">×</button>
  <h2 id="ctitle">السلة</h2>
  <div id="citems"></div>
  <div class="row"><b>الإجمالي</b><b id="ctotal"></b></div>
  <a class="btn" id="goCheck" href="checkout.html" style="text-align:center;text-decoration:none">إتمام الطلب</a>
</div></dialog>

<script src="config.js"></script>
<script src="store.js"></script>
<script>
const $ = (i) => document.getElementById(i), C = window.JENOVA;
// لو عندك صورة للبنطلون (قدام وورا جنب بعض في صورة واحدة)، حط مسارها في img
const PRODUCTS = [
  { id: "balloon",  name: "Balloon Fit",  price: 800, img: "", b1: 24, b2: -6, bo: 40, bi: 10, color: "#6f93c0" },
  { id: "straight", name: "Straight Leg", price: 800, img: "", b1: 0,  b2: 0,  bo: 50, bi: 8,  color: "#3f628f" },
  { id: "wide",     name: "Wide Leg",     price: 800, img: "", b1: 8,  b2: 6,  bo: 72, bi: 14, color: "#26395d" },
];

function jeansSVG(p, side) {
  const { b1, b2, bo, bi, color } = p, S = "#e8b631";
  const d = `M50,10 H150 L152,44 C${152 + b1},150 ${100 + bo + b2},250 ${100 + bo},340 H${100 + bi} C${100 + bi - 4},250 104,190 100,130 C96,190 ${100 - bi + 4},250 ${100 - bi},340 H${100 - bo} C${100 - bo - b2},250 ${48 - b1},150 48,44 Z`;
  const front = `<path d="M100,24 V118" stroke="${S}" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
    <path d="M54,26 Q62,62 92,66 M146,26 Q138,62 108,66" stroke="${S}" stroke-width="2" stroke-dasharray="5 3" fill="none"/>`;
  const back = `<path d="M50,30 Q100,52 150,30" stroke="${S}" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
    <path d="M62,58 H92 V92 L77,102 L62,92 Z M108,58 H138 V92 L123,102 L108,92 Z" stroke="${S}" stroke-width="2" stroke-dasharray="5 3" fill="none"/>`;
  return `<svg viewBox="0 0 200 350" role="img" aria-label="${p.name} ${side === "front" ? "من قدام" : "من ورا"}">
    <path d="${d}" fill="${color}"/>
    <path d="${d}" fill="none" stroke="#0f1a2c" stroke-opacity=".35" stroke-width="2"/>
    <rect x="50" y="10" width="100" height="16" fill="#0f1a2c" fill-opacity=".28"/>
    ${[62, 100, 138].map((x) => `<rect x="${x - 3}" y="8" width="6" height="22" fill="#0f1a2c" fill-opacity=".35"/>`).join("")}
    ${side === "front" ? front : back}
    <path d="M${100 + bi},336 H${100 + bo}" stroke="${S}" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M${100 - bi},336 H${100 - bo}" stroke="${S}" stroke-width="2" stroke-dasharray="5 3"/>
  </svg>`;
}
function visual(p, side) {
  return p.img
    ? `<div class="ph" role="img" aria-label="${p.name}" style="background-image:url('${p.img}');background-position:${side === "front" ? "0" : "100%"} 50%"></div>`
    : jeansSVG(p, side);
}

/* الرف */
PRODUCTS.forEach((p) => {
  const b = document.createElement("button"); b.className = "hang"; b.type = "button";
  b.setAttribute("aria-label", `${p.name} - افتح التفاصيل`);
  b.innerHTML = `<span class="hook"></span>${visual(p, "front")}<span class="nm"></span><span class="pr">${p.price} جنيه</span>`;
  b.querySelector(".nm").textContent = p.name;
  b.onclick = () => openProduct(p);
  $("items").append(b);
});

/* تفاصيل المنتج */
let cur = null, size = null;
function showView(side) {
  $("view").innerHTML = visual(cur, side);
  document.querySelectorAll("#views button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === side));
}
function openProduct(p) {
  cur = p; size = null; $("perr").textContent = "";
  $("pname").textContent = p.name; $("pprice").textContent = p.price + " جنيه";
  $("sizes").innerHTML = "";
  C.SIZES.forEach((s) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { size = s; $("perr").textContent = ""; [...$("sizes").children].forEach((x) => x.setAttribute("aria-pressed", x === b)); };
    $("sizes").append(b);
  });
  showView("front"); $("pdlg").showModal(); track("view_product", { product_id: p.id });
}
document.querySelectorAll("#views button").forEach((b) => (b.onclick = () => showView(b.dataset.v)));
$("pclose").onclick = () => $("pdlg").close();
$("addBtn").onclick = () => {
  if (!size) { $("perr").textContent = "اختار المقاس الأول"; return; }
  Jenova.add({ id: cur.id, name: cur.name, price: cur.price, size });
  track("add_to_cart", { product_id: cur.id });
  $("pdlg").close(); renderCart(); $("cdlg").showModal();
};

/* السلة */
function renderCart() {
  const cart = Jenova.cart();
  $("bagN").textContent = Jenova.count(); $("ctotal").textContent = Jenova.total() + " جنيه";
  $("citems").innerHTML = cart.length ? "" : '<p class="muted empty">السلة فاضية. اختار بنطلون من الرف.</p>';
  $("goCheck").style.display = cart.length ? "block" : "none";
  cart.forEach((i) => {
    const r = document.createElement("div"); r.className = "row";
    const t = document.createElement("div"); t.textContent = `${i.name} • مقاس ${i.size}`;
    const q = document.createElement("div"); q.className = "qty";
    const mk = (txt, label, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = txt; b.setAttribute("aria-label", label); b.onclick = fn; return b; };
    const n = document.createElement("span"); n.textContent = ` ${i.qty} `;
    q.append(mk("+", "زيادة", () => Jenova.setQty(i.id, i.size, Math.min(10, i.qty + 1))), n, mk("−", "تقليل", () => Jenova.setQty(i.id, i.size, i.qty - 1)));
    r.append(t, q); $("citems").append(r);
  });
}
document.addEventListener("jenova:cart", renderCart);
$("bagBtn").onclick = () => { renderCart(); $("cdlg").showModal(); };
$("cclose").onclick = () => $("cdlg").close();
renderCart();

/* إحصائيات الزوار (جدول events في Supabase) */
let sid; try { sid = sessionStorage.getItem("jsid") || crypto.randomUUID(); sessionStorage.setItem("jsid", sid); } catch { sid = crypto.randomUUID(); }
function track(type, extra = {}, keepalive = false) {
  if (!C.SUPABASE_URL || C.SUPABASE_URL.includes("YOUR-PROJECT")) return;
  try {
    fetch(`${C.SUPABASE_URL}/rest/v1/events`, {
      method: "POST", keepalive,
      headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Prefer: "return=minimal" },
      body: JSON.stringify({ session_id: sid, type, ...extra }),
    }).catch(() => {});
  } catch {}
}
const t0 = Date.now(); let sent = false;
track("visit", { referrer: (document.referrer || "").slice(0, 200), device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop" });
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && !sent) { sent = true; track("duration", { seconds: Math.round((Date.now() - t0) / 1000) }, true); }
});
</script>
</body>
</html>
